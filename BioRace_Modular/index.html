<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Runner: Multiplayer Edition</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* --- NEW MENU STYLES --- */
        #main-menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        h1 { font-size: 60px; margin-bottom: 10px; color: #ff3366; text-shadow: 0 0 20px #ff0000; text-transform: uppercase; letter-spacing: 5px; }
        
        .menu-box {
            background: rgba(255,255,255,0.05);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            width: 400px;
        }

        .color-picker { margin: 20px 0; display: flex; justify-content: center; gap: 10px; }
        .swatch { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(255,255,255,0.2); transition: transform 0.2s; }
        .swatch:hover { transform: scale(1.2); border-color: white; }
        .swatch.selected { box-shadow: 0 0 15px white; border-color: white; transform: scale(1.1); }

        #start-btn {
            background: linear-gradient(45deg, #ff0050, #ff0000);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255,0,0,0.4);
            transition: all 0.3s;
            text-transform: uppercase;
        }
        #start-btn:hover { transform: scale(1.05); box-shadow: 0 0 50px rgba(255,0,0,0.8); }

        .lobby-info { margin-top: 20px; font-size: 12px; color: #888; }
    </style>
</head>
<body>

    <!-- MAIN MENU -->
    <div id="main-menu">
        <h1>Bio-Race</h1>
        <div class="menu-box">
            <div style="font-size: 14px; opacity: 0.7; letter-spacing: 2px;">SELECT GENETIC MARKER</div>
            
            <!-- Color Selection -->
            <div class="color-picker" id="color-picker">
                <div class="swatch selected" style="background: #ffffff;" data-color="0xffffff"></div>
                <div class="swatch" style="background: #00ff88;" data-color="0x00ff88"></div>
                <div class="swatch" style="background: #ff0050;" data-color="0xff0050"></div>
                <div class="swatch" style="background: #0088ff;" data-color="0x0088ff"></div>
                <div class="swatch" style="background: #ffff00;" data-color="0xffff00"></div>
            </div>

            <button id="start-btn">DEPLOY CELL</button>
            
            <div class="lobby-info">
                TIKTOK LIVE MULTIPLAYER READY<br>
                WAITING FOR VIEWERS...
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="ui-layer">
        <div class="hud-panel left">
            <div class="label">DISTANCE TO TARGET</div>
            <div id="distance">5000m</div>
            <div id="progress-container"><div id="progress-bar"></div></div>
        </div>
        <div class="hud-panel right">
            <div class="label">MULTIPLAYER FEED</div>
            <div id="event-log">WAITING FOR GIFTS...</div>
        </div>
    </div>

    <!-- WIN SCREEN -->
    <div id="win-screen">
        <div id="win-text">TARGET FERTILIZED</div>
        <button id="restart-btn" onclick="location.reload()">RESTART</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "cannon": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
        }
    }
    </script>

    <script type="module" src="./src/Main.js"></script>
</body>
</html>
